version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: audit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/audit_db
      - REDIS_URL=redis://redis:6379/0
      - MCP_SERVER_URL=http://host.docker.internal:3000/api/mcp # Adjust as needed
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  # Optional: GitHub MCP Server container if available
  # mcp-server:
  #   image: ghcr.io/modelcontextprotocol/server-github:latest
  #   ...

volumes:
  postgres_data:
